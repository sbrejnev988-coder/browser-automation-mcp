name: hermes-omnicouncil
version: 5.6.3
description: "Hermes OmniCouncil v5.6.3 — консилиум из ЛЮБЫХ моделей (OpenRouter, Anthropic, OpenAI, DeepSeek, локальные, custom) через provider:model синтаксис. Council-safe режим: модели читают workspace/memory + пишут blackboard, мутации — только operator. явный COUNCIL_DENIED_TOOLS deny-list, broker_tool_call единая точка входа, двухуровневый blackboard (ephemeral + durable memory-wiki), MUTATION_POLICY (propose_only/judge_approved/operator_only). Presets — только sizing, модели — из аргументов пользователя."
